<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data: blob:; connect-src 'self' https://api.github.com https://www.googleapis.com https://oauth2.googleapis.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Penmit PDF">
<meta name="description" content="Penmit PDF: read and handwrite on PDFs on any device, and keep them in your own Google Drive or GitHub.">
<title>Penmit PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Library -->
<section id="library" class="view">
  <header class="lib-header">
    <div class="lib-top">
      <div class="lib-title">
        <h1 data-i18n="library"></h1>
        <p class="sync-line" id="sync-line"></p>
      </div>
      <button class="nav-btn labeled" id="lib-sync" type="button" data-i18n-label="sync">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1"/><path d="M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3"/></svg>
        <span data-i18n="sync"></span>
      </button>
      <button class="nav-btn" id="lib-settings" type="button" data-i18n-label="settings" data-i18n-title="settings">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.07 9.81 L21.46 10.38 L21.46 13.62 L19.07 14.19 L18.55 15.45 L19.84 17.54 L17.54 19.84 L15.45 18.55 L14.19 19.07 L13.62 21.46 L10.38 21.46 L9.81 19.07 L8.55 18.55 L6.46 19.84 L4.16 17.54 L5.45 15.45 L4.93 14.19 L2.54 13.62 L2.54 10.38 L4.93 9.81 L5.45 8.55 L4.16 6.46 L6.46 4.16 L8.55 5.45 L9.81 4.93 L10.38 2.54 L13.62 2.54 L14.19 4.93 L15.45 5.45 L17.54 4.16 L19.84 6.46 L18.55 8.55Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="lib-tools" id="lib-tools">
      <label class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search" data-i18n-label="search">
      </label>
      <button class="sort-btn" id="sort-btn" type="button" aria-haspopup="menu">
        <span id="sort-label"></span>
        <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
      </button>
    </div>
  </header>

  <main class="lib-main" id="lib-main">
    <ul id="doc-list" class="doc-grid">
      <li class="doc-new">
        <button class="doc-new-btn" id="open-pdf" type="button">
          <span class="doc-new-box"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="doc-name" data-i18n="openPdf"></span>
        </button>
      </li>
    </ul>
    <div id="lib-empty" class="empty" hidden>
      <svg class="empty-art" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="30" y="18" width="60" height="80" rx="8" class="paper"/>
        <path d="M42 42h36M42 54h36M42 66h22" class="lines"/>
        <path d="M44 84c5-7 9-8 11-3s6 5 10-1 8-6 10-1" class="scribble"/>
      </svg>
      <p class="empty-title" data-i18n="emptyTitle"></p>
      <p class="empty-body" data-i18n="emptyBody"></p>
      <div class="empty-actions">
        <button class="btn primary" id="empty-open" type="button" data-i18n="openPdf"></button>
        <button class="btn" id="empty-sync" type="button" data-i18n="syncFromCloud" hidden></button>
      </div>
    </div>
    <p id="no-results" class="no-results" hidden></p>
  </main>
  <div id="drop-hint" class="drop-hint" hidden><span data-i18n="dropHere"></span></div>
</section>

<!-- Reader -->
<section id="reader" class="view" hidden>
  <header class="reader-nav">
    <button class="nav-btn back" id="back" type="button" data-i18n-label="backToLibrary">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span data-i18n="library"></span>
    </button>
    <div class="doc-title" id="doc-title"></div>
    <div class="nav-actions">
      <button class="nav-btn" id="pages-btn" type="button" aria-expanded="false" aria-controls="pages-panel" data-i18n-label="pagesPanel" data-i18n-title="pagesPanel">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="6.5" height="7.5" rx="1.2"/><rect x="13.5" y="3.5" width="6.5" height="7.5" rx="1.2"/><rect x="4" y="13" width="6.5" height="7.5" rx="1.2"/><rect x="13.5" y="13" width="6.5" height="7.5" rx="1.2"/></svg>
      </button>
      <button class="nav-btn" id="view-btn" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-label="layout" data-i18n-title="layout">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.4 5 8 4.5 3.5 4.5v13c4.5 0 6.9.5 8.5 2 1.6-1.5 4-2 8.5-2v-13C16 4.5 13.6 5 12 6.5z"/><path d="M12 6.5v13"/></svg>
      </button>
      <button class="nav-btn" id="fullscreen" type="button" data-i18n-label="fullscreen" data-i18n-title="fullscreen">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="nav-btn" id="export" type="button" data-i18n-label="export" data-i18n-title="export">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M8 7.5l4-4 4 4"/><path d="M8.5 10.5H6.5a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-8.5a1 1 0 0 0-1-1h-2"/></svg>
      </button>
      <button class="nav-btn" id="reader-sync" type="button" data-i18n-label="sync" data-i18n-title="sync">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1"/><path d="M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3"/></svg>
      </button>
    </div>

    <div class="menu view-menu" id="view-menu" role="menu" hidden>
      <button class="menu-item" type="button" role="menuitemradio" data-layout="single">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3.5" width="10" height="17" rx="1.5"/></svg>
        <span data-i18n="single"></span>
        <svg class="i check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <button class="menu-item" type="button" role="menuitemradio" data-layout="double">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="9" height="15" rx="1.5"/><rect x="12.5" y="4.5" width="9" height="15" rx="1.5"/></svg>
        <span data-i18n="double"></span>
        <svg class="i check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <button class="menu-item" type="button" role="menuitemradio" data-layout="cover">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="8" rx="1.2"/><rect x="2.5" y="13" width="9" height="8.5" rx="1.2"/><rect x="12.5" y="13" width="9" height="8.5" rx="1.2"/></svg>
        <span data-i18n="cover"></span>
        <svg class="i check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <div class="menu-sep" role="separator"></div>
      <div class="zoom-row">
        <button class="zoom-btn" id="zoom-out" type="button" data-i18n-label="zoomOut">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        </button>
        <button class="zoom-label" id="zoom-fit" type="button" data-i18n-title="fitWidth">100%</button>
        <button class="zoom-btn" id="zoom-in" type="button" data-i18n-label="zoomIn">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
        </button>
      </div>
      <p class="menu-note" data-i18n="zoomNote"></p>
    </div>
  </header>

  <nav class="toolbar" id="toolbar" data-i18n-label="tools">
    <div class="tb-history">
      <button class="tb-btn" id="undo" type="button" data-i18n-label="undo" data-i18n-title="undo">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="tb-btn" id="redo" type="button" data-i18n-label="redo" data-i18n-title="redo">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
    </div>
    <div class="tools" role="radiogroup" data-i18n-label="tools">
      <button class="tool" type="button" role="radio" data-tool="hand" data-i18n-title="hand" data-i18n-label="hand">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11M11 10.5V5a1.5 1.5 0 0 1 3 0v6M14 10.5V6.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 6.5-6 6.5-2.6 0-4.2-1.3-5.4-3.4L4 14.2a1.5 1.5 0 0 1 2.6-1.5L8 15"/></svg>
      </button>
      <button class="tool" type="button" role="radio" data-tool="pen" data-i18n-title="pen" data-i18n-label="pen">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l1-4L16 5a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8.5 18.5z"/><path d="M14.5 6.5l3 3"/></svg>
        <span class="tool-color" aria-hidden="true"></span>
      </button>
      <button class="tool" type="button" role="radio" data-tool="highlighter" data-i18n-title="highlighter" data-i18n-label="highlighter">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l-3 3h5l1.5-1.5"/><path d="M8.5 12.5L16 5l3 3-7.5 7.5z"/></svg>
        <span class="tool-color" aria-hidden="true"></span>
      </button>
      <button class="tool" type="button" role="radio" data-tool="eraser" data-i18n-title="eraser" data-i18n-label="eraser">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 19.5L4 15l9.5-9.5 6.5 6.5-7.5 7.5z"/><path d="M8.5 19.5H20M9 10l5 5"/></svg>
      </button>
      <button class="tool" type="button" role="radio" data-tool="lasso" data-i18n-title="lasso" data-i18n-label="lasso">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c4.4 0 8 2.3 8 5.2s-3.6 5.3-8 5.3-8-2.4-8-5.3S7.6 4 12 4z" stroke-dasharray="2.6 2.4"/><path d="M7.6 13.6c-.9 2 .1 4 2.3 4.6"/><circle cx="10.6" cy="19.2" r="1.3"/></svg>
      </button>
    </div>
    <div class="palette" id="palette">
      <div class="swatches" id="swatches" role="radiogroup" data-i18n-label="color"></div>
      <div class="widths" id="widths" role="radiogroup" data-i18n-label="thickness"></div>
      <div class="eraser-opts" id="eraser-opts">
        <div class="seg" role="radiogroup" data-i18n-label="eraser">
          <button type="button" role="radio" data-erase="stroke" data-i18n="eraseStroke"></button>
          <button type="button" role="radio" data-erase="partial" data-i18n="erasePartial"></button>
        </div>
        <div class="widths" id="eraser-sizes" role="radiogroup" data-i18n-label="eraserSize"></div>
      </div>
      <p class="palette-hint" id="lasso-hint" data-i18n="lassoHint"></p>
    </div>
  </nav>

  <div class="stage">
    <aside class="pages-panel" id="pages-panel" hidden data-i18n-label="pagesPanel">
      <div class="pp-head">
        <div class="seg" role="tablist">
          <button type="button" role="tab" data-pp="thumbs" aria-selected="true" data-i18n="pagesTab"></button>
          <button type="button" role="tab" data-pp="outline" aria-selected="false" data-i18n="outlineTab"></button>
        </div>
        <button class="nav-btn" id="pp-close" type="button" data-i18n-label="close">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="pp-body" id="pp-body">
        <ol class="thumbs" id="thumbs"></ol>
        <div class="outline" id="outline" hidden></div>
      </div>
      <div class="pp-foot">
        <button class="btn add-blank" id="add-blank" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v10M7 12h10"/><rect x="5" y="3.5" width="14" height="17" rx="1.5"/></svg>
          <span data-i18n="addBlank"></span>
        </button>
      </div>
    </aside>
    <div id="scroller" class="scroller">
      <div id="pages" class="pages"></div>
    </div>
    <button class="page-ind" id="page-ind" type="button" aria-haspopup="dialog" data-i18n-title="gotoTitle"></button>
    <div class="fs-controls">
      <button class="fs-btn" id="fs-undo" type="button" data-i18n-label="undo">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="fs-btn" id="fs-exit" type="button" data-i18n-label="exitFullscreen">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- Settings -->
<dialog id="settings" class="sheet">
  <form method="dialog" class="sheet-body" id="settings-form">
    <header class="sheet-head">
      <button class="text-btn" value="cancel" type="submit" data-i18n="cancel"></button>
      <h2 data-i18n="settings"></h2>
      <button class="text-btn strong" value="save" type="submit" data-i18n="save"></button>
    </header>

    <div class="sheet-scroll">
      <h3 class="group-title" data-i18n="storage"></h3>
      <div class="group" role="radiogroup" data-i18n-label="storage">
        <label class="cell choice"><input type="radio" name="storage" value="none"><span class="cell-text"><span data-i18n="storageNone"></span><small data-i18n="storageNoneHint"></small></span><svg class="i check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></label>
        <label class="cell choice"><input type="radio" name="storage" value="gdrive"><span class="cell-text"><span data-i18n="storageDrive"></span><small data-i18n="storageDriveHint"></small></span><svg class="i check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></label>
        <label class="cell choice"><input type="radio" name="storage" value="github"><span class="cell-text"><span data-i18n="storageGitHub"></span><small data-i18n="storageGitHubHint"></small></span><svg class="i check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></label>
      </div>

      <section id="autosync-group" hidden>
        <div class="group spaced">
          <label class="cell"><span class="cell-label grow" data-i18n="autoSync"></span><input class="switch" type="checkbox" role="switch" name="autoSync"></label>
        </div>
        <p class="group-note" data-i18n="autoSyncHint"></p>
      </section>

      <section id="gdrive-panel" hidden>
        <h3 class="group-title" data-i18n="googleAccount"></h3>
        <div class="group" id="gdrive-actions">
          <div class="cell"><span class="cell-label" data-i18n="account"></span><span class="status cell-value" id="gdrive-status" role="status"></span></div>
          <button class="cell action" type="button" id="google-sign-in" data-i18n="googleSignIn"></button>
          <button class="cell action danger" type="button" id="google-sign-out" hidden data-i18n="googleSignOut"></button>
        </div>
        <p class="group-note warn" id="gdrive-unavailable" hidden></p>
        <p class="group-note" data-i18n="driveIntro"></p>
      </section>

      <section id="github-panel" hidden>
        <h3 class="group-title" data-i18n="githubStorage"></h3>
        <div class="group">
          <label class="cell field"><span class="cell-label" data-i18n="owner"></span><input name="owner" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="ownerPlaceholder"></label>
          <label class="cell field"><span class="cell-label" data-i18n="repo"></span><input name="repo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="penmit-notes"></label>
          <label class="cell field"><span class="cell-label" data-i18n="branch"></span><input name="branch" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="branchPlaceholder"></label>
          <label class="cell field"><span class="cell-label" data-i18n="token"></span><input name="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
          <div class="cell"><button class="link-btn" type="button" id="test-github" data-i18n="testConnection"></button><span class="status cell-value" id="github-status" role="status"></span></div>
        </div>
        <p class="group-note"><span data-i18n="tokenHelp"></span> <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" data-i18n="tokenLink"></a></p>
      </section>

      <h3 class="group-title" data-i18n="input"></h3>
      <div class="group">
        <label class="cell"><span class="cell-label grow" data-i18n="fingerDraw"></span><input class="switch" type="checkbox" role="switch" name="fingerDraw"></label>
      </div>
      <p class="group-note" data-i18n="fingerDrawHint"></p>

      <h3 class="group-title" data-i18n="about"></h3>
      <div class="group">
        <div class="cell"><span class="cell-label grow" data-i18n="versionLabel"></span><span class="cell-value" id="version"></span></div>
        <a class="cell link" href="https://choo-ai-dev.github.io/penmit-pdf/privacy.html" target="_blank" rel="noopener"><span class="cell-label grow" data-i18n="privacy"></span><svg class="i sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
        <a class="cell link" href="https://github.com/Choo-AI-Dev/penmit-pdf" target="_blank" rel="noopener"><span class="cell-label grow" data-i18n="sourceCode"></span><svg class="i sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
      </div>
    </div>
  </form>
</dialog>

<!-- Rename -->
<dialog id="rename" class="alert">
  <form method="dialog" id="rename-form">
    <h2 data-i18n="renameTitle"></h2>
    <input name="name" autocomplete="off" spellcheck="false" required>
    <div class="alert-actions">
      <button class="alert-btn strong" value="ok" type="submit" data-i18n="renameOk"></button>
      <button class="alert-btn" value="cancel" type="submit" formnovalidate data-i18n="cancel"></button>
    </div>
  </form>
</dialog>

<!-- Go to page -->
<dialog id="goto" class="alert">
  <form method="dialog" id="goto-form">
    <h2 data-i18n="gotoTitle"></h2>
    <p class="alert-sub" id="goto-range"></p>
    <input name="page" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" required>
    <div class="alert-actions">
      <button class="alert-btn strong" value="ok" type="submit" data-i18n="gotoOk"></button>
      <button class="alert-btn" value="cancel" type="submit" formnovalidate data-i18n="cancel"></button>
    </div>
  </form>
</dialog>

<input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
