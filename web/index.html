<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Penmit PDF: read and handwrite on PDFs on any device, and keep them in your own GitHub repository.">
<title>Penmit PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Library -->
<section id="library" class="view">
  <header class="bar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Penmit PDF</span></div>
    <div class="spacer"></div>
    <button class="btn" id="lib-sync" type="button">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1"/><path d="M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3"/></svg>
      <span data-i18n="sync"></span>
    </button>
    <button class="icon-btn" id="lib-settings" type="button" data-i18n-label="settings">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></svg>
    </button>
  </header>
  <main class="lib-main">
    <div class="lib-head">
      <h1 data-i18n="library"></h1>
      <button class="btn primary" id="open-pdf" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="openPdf"></span>
      </button>
    </div>
    <ul id="doc-list" class="doc-grid"></ul>
    <div id="lib-empty" class="empty" hidden>
      <p class="empty-title" data-i18n="emptyTitle"></p>
      <p data-i18n="emptyBody"></p>
    </div>
  </main>
  <div id="drop-hint" class="drop-hint" hidden><span data-i18n="dropHere"></span></div>
</section>

<!-- Reader -->
<section id="reader" class="view" hidden>
  <header class="bar reader-bar">
    <button class="icon-btn" id="back" type="button" data-i18n-label="backToLibrary">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="doc-title" id="doc-title"></div>
    <div class="spacer"></div>
    <div class="seg-group" role="group" data-i18n-label="layout">
      <button class="seg" type="button" data-layout="single" data-i18n-title="single">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3.5" width="10" height="17" rx="1.5"/></svg>
        <span class="seg-text" data-i18n="singleShort"></span>
      </button>
      <button class="seg" type="button" data-layout="double" data-i18n-title="double">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="9" height="15" rx="1.5"/><rect x="12.5" y="4.5" width="9" height="15" rx="1.5"/></svg>
        <span class="seg-text" data-i18n="doubleShort"></span>
      </button>
      <button class="seg" type="button" data-layout="cover" data-i18n-title="cover">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="8" rx="1.2"/><rect x="2.5" y="13" width="9" height="8.5" rx="1.2"/><rect x="12.5" y="13" width="9" height="8.5" rx="1.2"/></svg>
        <span class="seg-text" data-i18n="coverShort"></span>
      </button>
    </div>
    <div class="zoom-group">
      <button class="icon-btn" id="zoom-out" type="button" data-i18n-label="zoomOut">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button class="zoom-label" id="zoom-fit" type="button" data-i18n-title="fitWidth">100%</button>
      <button class="icon-btn" id="zoom-in" type="button" data-i18n-label="zoomIn">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <span class="page-ind" id="page-ind" aria-live="polite"></span>
    <button class="btn" id="export" type="button">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4.5 17.5v3h15v-3"/></svg>
      <span class="btn-text" data-i18n="export"></span>
    </button>
    <button class="icon-btn" id="reader-sync" type="button" data-i18n-label="sync">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1"/><path d="M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3"/></svg>
    </button>
  </header>

  <div id="scroller" class="scroller">
    <div id="pages" class="pages"></div>
  </div>

  <nav class="toolbar" id="toolbar" data-i18n-label="tools">
    <div class="tools" role="radiogroup" data-i18n-label="tools">
      <button class="tool" type="button" role="radio" data-tool="hand" data-i18n-title="hand">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11M11 10.5V5a1.5 1.5 0 0 1 3 0v6M14 10.5V6.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 6.5-6 6.5-2.6 0-4.2-1.3-5.4-3.4L4 14.2a1.5 1.5 0 0 1 2.6-1.5L8 15"/></svg>
      </button>
      <button class="tool" type="button" role="radio" data-tool="pen" data-i18n-title="pen">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4"/></svg>
      </button>
      <button class="tool" type="button" role="radio" data-tool="highlighter" data-i18n-title="highlighter">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l-3 3h5l1.5-1.5"/><path d="M8.5 12.5L16 5l3 3-7.5 7.5z"/><path d="M4 21h16" class="hl-line"/></svg>
      </button>
      <button class="tool" type="button" role="radio" data-tool="eraser" data-i18n-title="eraser">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 19.5L4 15l9.5-9.5 6.5 6.5-7.5 7.5z"/><path d="M8.5 19.5H20M9 10l5 5"/></svg>
      </button>
    </div>
    <div class="sep" aria-hidden="true"></div>
    <div class="swatches" id="swatches" role="radiogroup" data-i18n-label="color"></div>
    <div class="sep" aria-hidden="true"></div>
    <div class="widths" id="widths" role="radiogroup" data-i18n-label="thickness"></div>
    <div class="sep" aria-hidden="true"></div>
    <button class="icon-btn" id="undo" type="button" data-i18n-label="undo">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="icon-btn" id="redo" type="button" data-i18n-label="redo">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
  </nav>
</section>

<!-- Settings -->
<dialog id="settings" class="sheet">
  <form method="dialog" class="sheet-body" id="settings-form">
    <header class="sheet-head">
      <h2 data-i18n="settings"></h2>
      <button class="icon-btn" value="cancel" type="submit" data-i18n-label="close">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <section class="field-group">
      <h3 data-i18n="githubStorage"></h3>
      <p class="hint" data-i18n="githubIntro"></p>
      <label class="field"><span data-i18n="owner"></span><input name="owner" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="my-github-id"></label>
      <label class="field"><span data-i18n="repo"></span><input name="repo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="penmit-notes"></label>
      <label class="field"><span data-i18n="branch"></span><input name="branch" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="branchPlaceholder"></label>
      <label class="field"><span data-i18n="token"></span><input name="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      <p class="hint"><span data-i18n="tokenHelp"></span> <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" data-i18n="tokenLink"></a></p>
      <p class="hint warn" data-i18n="tokenWarning"></p>
      <div class="row">
        <button class="btn" type="button" id="test-github" data-i18n="testConnection"></button>
        <span class="status" id="github-status" role="status"></span>
      </div>
    </section>

    <section class="field-group">
      <h3 data-i18n="input"></h3>
      <label class="check"><input type="checkbox" name="fingerDraw"><span data-i18n="fingerDraw"></span></label>
      <p class="hint" data-i18n="fingerDrawHint"></p>
    </section>

    <footer class="sheet-foot">
      <span class="version" id="version"></span>
      <div class="spacer"></div>
      <button class="btn" value="cancel" type="submit" data-i18n="cancel"></button>
      <button class="btn primary" value="save" type="submit" data-i18n="save"></button>
    </footer>
  </form>
</dialog>

<input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
