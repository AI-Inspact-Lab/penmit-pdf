<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penmit PDF</title>
<!-- A mistyped or cut-off address (for example a link that picked up the punctuation after it)
     goes back to the app instead of GitHub's error page. -->
<meta http-equiv="refresh" content="1; url=./">
<script>
  var base = "/" + (location.pathname.split("/")[1] || "") + "/";
  location.replace(base);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #4e5968;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; text-align: center; }
  a { color: #3a6ef2; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #17181c; color: #b4b8c0; } a { color: #6d97ff; } }
</style>
</head>
<body>
  <p>팬밋 PDF로 이동하는 중이에요.<br><a href="./">바로 열기</a></p>
</body>
</html>
