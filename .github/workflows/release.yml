# Builds the Windows (setup.exe, portable .exe), Linux (AppImage, .deb) and Android (.apk) apps.
# - Publishing a GitHub Release builds everything and attaches the files to that release.
# - "Run workflow" (manual) builds everything and keeps the files as workflow artifacts.
#
# Android signing: add these repository secrets so every APK is signed with the same key and
# installs over the previous version (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Without them a debug-signed APK is built; it installs fine but cannot update an earlier one.
name: Build apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then v="${TAG#v}"; else v=$(node -p "require('./desktop/package.json').version"); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build
        shell: bash
        working-directory: desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          rm -rf app && cp -r ../web app && rm -f app/sw.js
          npx electron-builder --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare the Android project
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ github.run_number }}
        run: |
          (cd mobile && npm install --no-audit --no-fund)
          bash scripts/prepare-android.sh "$VERSION" "$CODE"
      - name: Signing key from secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Android signing secrets: building a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: mobile/android
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ "$SIGNED" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "../dist/Penmit-PDF-${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "../dist/Penmit-PDF-${VERSION}.apk" | head -3
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/Penmit-PDF-${VERSION}-debug.apk"
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          if-no-files-found: error
          path: mobile/dist/*.apk

  publish:
    needs: [desktop, android]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" * --repo "$REPO" --clobber
